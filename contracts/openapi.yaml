openapi: 3.1.0
info:
  title: POS Admin Dashboard API
  version: 1.0.0
  summary: The backend contract for the register and back office.
  description: |
    This is the contract the web app's REST adapter speaks and the Symfony server in `api/` implements.

    - Money is always an integer number of millimes (1 TND = 1000 millimes) in fields ending in `_millimes`.
    - Records a device writes (order events, sales, refunds, session opens and closes) carry an id chosen by the device
      and a `payload_hash`. Sending the same record again returns its stored outcome with HTTP 200; a first write
      returns 201.
    - Open orders are working state, not the ledger: what is on a table right now. The ledger takes over at payment,
      and `POST /api/v1/sales` marks the items it paid for and closes the order when nothing is owed.
    - There is no "open an order" operation. An order is created by the server when the first item lands on a free
      table, so two devices adding to the same table never race on creating it.
    - Errors use one envelope and the codes in `contracts/errors.md`, including the order in which checks run.
servers:
  - url: http://127.0.0.1:8000
    description: The Symfony server in api/, run locally with `php -S 127.0.0.1:8000 -t public`
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Catalog
  - name: Tables
  - name: Orders
  - name: Kitchen
  - name: Reports
  - name: Settings
  - name: Terminals
  - name: Cash sessions
  - name: Sales

paths:
  /api/v1/auth/token:
    post:
      tags: [Auth]
      operationId: createToken
      summary: Sign in with email and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in member and their shop role.
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Products that are not archived, in creation order.
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Create a product. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [Catalog]
      operationId: updateProduct
      summary: Update a product. Stock changes only by `stock_delta`. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Catalog]
      operationId: archiveProduct
      summary: Archive a product. Sales that mention it keep pointing at it. Admin only.
      responses:
        '204': { description: Archived. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/products/{productId}/availability:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [Catalog]
      operationId: setProductAvailability
      summary: Put a product on the menu or take it off for the day. Admin, cashier or waiter.
      description: The daily sold-out toggle, which the floor may use. It touches nothing else about the product, and nothing already ordered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductAvailability' }
      responses:
        '200':
          description: The product as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/stock-adjustments:
    post:
      tags: [Catalog]
      operationId: adjustStock
      summary: Correct counted stock, leaving the movement behind as the reason. Idempotent by record id. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockAdjustment' }
      responses:
        '201':
          description: Counted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockAdjustmentResult' }
        '200':
          description: This same correction was already counted (replayed); the stock as of then.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockAdjustmentResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      operationId: createCategory
      summary: Create a category. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Catalog]
      operationId: deleteCategory
      summary: Delete a category; its products become uncategorised. Admin only.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/dining-tables:
    get:
      tags: [Tables]
      operationId: listDiningTables
      summary: Every table of the shop, in the admin's order, retired ones included.
      responses:
        '200':
          description: Tables.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiningTable' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tables]
      operationId: createDiningTable
      summary: Add a table to the room. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiningTableInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiningTable' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/dining-tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
    put:
      tags: [Tables]
      operationId: updateDiningTable
      summary: Rename a table, move it in the room, or retire it. Admin only.
      description: Retiring leaves an order already open on the table open - the guests are still sitting there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiningTableInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiningTable' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/table-board:
    get:
      tags: [Tables]
      operationId: getTableBoard
      summary: The grid - one entry per active table, free or with what it owes.
      responses:
        '200':
          description: The board, in the admin's table order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TableBoardEntry' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/dining-tables/{tableId}/open-order:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Orders]
      operationId: getOpenOrder
      summary: The table's open order with its items, or null when the table is free.
      responses:
        '200':
          description: The open order, or null.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenOrder'
                  - type: 'null'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/order-items:
    post:
      tags: [Orders]
      operationId: addOrderItem
      summary: Put an item on a table. Idempotent by record id. Admin, cashier or waiter.
      description: The server finds the table's open order or opens one, so there is no operation that opens an order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderItemAddRecord' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderItemAddResult' }
        '200':
          description: This same record already added it (replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderItemAddResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/order-items/{itemId}/removals:
    parameters:
      - $ref: '#/components/parameters/OrderItemId'
    post:
      tags: [Orders]
      operationId: removeOrderItem
      summary: Take an item off a table, with a reason. Idempotent by record id. Admin, cashier or waiter.
      description: The row stays, stamped with who removed it and why, because an item removed after the kitchen was told is what the fraud report is made of.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderItemRemoveRecord' }
      responses:
        '201':
          description: Removed. `affected` is 0 when the item was already off the table.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWriteResult' }
        '200':
          description: This same record already removed it (replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWriteResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/order-items/{itemId}/preparations:
    parameters:
      - $ref: '#/components/parameters/OrderItemId'
    post:
      tags: [Kitchen]
      operationId: prepareOrderItem
      summary: Mark an item prepared. Idempotent by record id. Kitchen or admin.
      description: Two cooks tapping the same line is not a conflict - the first stamp stands and the second write answers `affected` 0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderItemPrepareRecord' }
      responses:
        '201':
          description: Prepared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWriteResult' }
        '200':
          description: This same record already prepared it (replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWriteResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/dining-tables/{tableId}/sends:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [Orders]
      operationId: sendOrder
      summary: Tell the kitchen about every unsent item of the table. Idempotent by record id. Admin, cashier or waiter.
      description: One send is one ticket. Nothing left to send is not an error - `affected` is 0.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderSendRecord' }
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWriteResult' }
        '200':
          description: This same record already sent them (replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWriteResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/dining-tables/{tableId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel the table's open order, with a reason. Idempotent by record id. Cashier or admin.
      description: ORDER_CHANGED when any item of the order is already paid - only a refund undoes that.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCancelRecord' }
      responses:
        '201':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWriteResult' }
        '200':
          description: This same record already cancelled it (replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWriteResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/open-orders:
    get:
      tags: [Orders]
      operationId: pollOpenOrderChanges
      summary: What has changed in the shop, for a client that polls instead of holding a live connection.
      description: Without `since` the answer is a cursor and no topics - the starting point for polling, because what changed before a screen opened is already in what it read.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string }
          description: The cursor of the previous answer.
      responses:
        '200':
          description: The changes since `since`, and the cursor to send next time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenOrderChanges' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/kitchen-tickets:
    get:
      tags: [Kitchen]
      operationId: listKitchenTickets
      summary: Sent, unprepared items grouped by send, oldest ticket first.
      description: A paid table keeps its ticket - the coffee still has to be made - and a cancelled one loses it.
      responses:
        '200':
          description: Tickets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KitchenTicket' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/reports/removed-after-sent-items:
    get:
      tags: [Reports]
      operationId: listRemovedAfterSentItems
      summary: What was taken off tables after the kitchen had been told, newest first. Admin only.
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Timestamp' }
        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: The removed items of the period, both ends inclusive.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RemovedAfterSentItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/shop-settings:
    get:
      tags: [Settings]
      operationId: getShopSettings
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: updateShopSettings
      summary: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/terminals/{terminalCode}/registrations:
    parameters:
      - name: terminalCode
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TerminalCode' }
    post:
      tags: [Terminals]
      operationId: registerTerminal
      summary: Register this device as the terminal. Admin only.
      description: Creates the terminal on first use and bumps its epoch every time, so records from a previously registered device fail with TERMINAL_SUPERSEDED.
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerminalRegistration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/cash-sessions:
    get:
      tags: [Cash sessions]
      operationId: listCashSessions
      summary: Sessions of a terminal, newest first. `status=open` returns at most one.
      parameters:
        - name: terminal_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, closed] }
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cash sessions]
      operationId: openCashSession
      summary: Open a session with the terminal-written record. Idempotent by record id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenSessionRecord' }
      responses:
        '201':
          description: Opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenSessionResult' }
        '200':
          description: Already opened by this same record (replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenSessionResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/cash-sessions/{sessionId}/closures:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Cash sessions]
      operationId: closeCashSession
      summary: Close a session with the terminal-written record. Only the terminal that owns it can close it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseSessionRecord' }
      responses:
        '201':
          description: Closed; the server's Z-report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseSessionResult' }
        '200':
          description: Already closed by this same record (replayed); the Z-report stored at close time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseSessionResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/cash-sessions/{sessionId}/z-report:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Cash sessions]
      operationId: getZReport
      summary: The stored report of a closed session, or the running report of an open one.
      responses:
        '200':
          description: Z-report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sales:
    get:
      tags: [Sales]
      operationId: listSales
      summary: Sales and refunds, newest first.
      parameters:
        - name: terminal_id
          in: query
          schema: { type: string, format: uuid }
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: table_id
          in: query
          schema: { type: string, format: uuid }
          description: What was paid at one table, for a receipt the caisse reads back.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Sales.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sales]
      operationId: recordSale
      summary: Record a sale or refund written by a terminal. Idempotent by record id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleRecord' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordSaleResult' }
        '200':
          description: This record was already recorded (status replayed) or voided by an admin (status voided).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordSaleResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        # A session, a product on a line, or the sale a refund gives back, that this shop does not have.
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/sales/{saleId}:
    parameters:
      - name: saleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Sales]
      operationId: getSale
      responses:
        '200':
          description: The sale, with how much of each line has been refunded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/receipt-voids:
    post:
      tags: [Sales]
      operationId: voidReceipt
      summary: Void a numbered record that can never be accepted, keeping the terminal's numbering gapless. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidReceiptRequest' }
      responses:
        '201':
          description: Voided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidReceiptResult' }
        '200':
          description: Already voided (replayed), or the record reached the ledger after all (recorded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidReceiptResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TableId:
      name: tableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: No session, or it expired (UNAUTHENTICATED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Not allowed for this member, shop, terminal or session (FORBIDDEN).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: The resource does not exist in the caller's shop (NOT_FOUND, or ITEM_NOT_FOUND for an order item).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: IDEMPOTENCY_CONFLICT, SEQUENCE_GAP, SESSION_CLOSED, SESSION_ALREADY_OPEN, TERMINAL_SUPERSEDED, ORDER_CHANGED, ORDER_CLOSED or TABLE_INACTIVE.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: A malformed payload or a broken business rule (VALIDATION_ERROR).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Millimes:
      type: integer
      format: int64
      description: An amount in millimes. 12.500 TND is 12500.

    Uuid:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    PayloadHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256, lowercase hex, of the canonical JSON of the record as the terminal built it, without this field. Stored and compared, never recomputed.

    TerminalCode:
      type: string
      pattern: '^[A-Z0-9]{1,8}$'

    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_ERROR
        - IDEMPOTENCY_CONFLICT
        - SEQUENCE_GAP
        - SESSION_CLOSED
        - SESSION_ALREADY_OPEN
        - TERMINAL_SUPERSEDED
        - ORDER_CHANGED
        - ORDER_CLOSED
        - ITEM_NOT_FOUND
        - TABLE_INACTIVE
        - RATE_LIMITED
        - SERVER_ERROR

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: A sentence for people. Never parse it.
            details:
              type: object
              additionalProperties: true
              description: 'Machine-readable context, e.g. { "expected_seq": 42, "received_seq": 43 } for SEQUENCE_GAP.'

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    Token:
      type: object
      required: [access_token, token_type, expires_in, member]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, description: Seconds. }
        member: { $ref: '#/components/schemas/Member' }

    Role:
      type: string
      enum: [admin, cashier, waiter, kitchen]

    Member:
      type: object
      required: [user_id, shop_id, roles, display_name, email]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        shop_id: { $ref: '#/components/schemas/Uuid' }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Role' }
          description: What the member may do. One person often holds several - the owner is an admin who also works the counter.
        display_name: { type: string }
        email: { type: string }

    Category:
      type: object
      required: [id, name, color, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    CategoryCreate:
      type: object
      required: [name, color]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }

    Product:
      type: object
      required:
        [
          id,
          name,
          price_millimes,
          category_id,
          category_name,
          barcode,
          description,
          image_url,
          is_available,
          track_stock,
          stock_qty,
          created_at,
          updated_at,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        price_millimes: { $ref: '#/components/schemas/Millimes' }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        category_name: { type: [string, 'null'] }
        barcode: { type: string, description: Empty when the product has none. }
        description: { type: string }
        image_url: { type: string }
        is_available:
          type: boolean
          description: On the menu right now. A café sells out of a dish and puts it back tomorrow, so this is a daily toggle rather than a change to the product.
        track_stock:
          type: boolean
          description: Whether stock is counted for this product. Most café items are made to order and are not, so `stock_qty` only means something when this is true.
        stock_qty:
          { type: integer, description: The sum of the product's stock movements; may be negative. }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    ProductAvailability:
      type: object
      required: [is_available]
      properties:
        is_available: { type: boolean }

    ProductFields:
      type: object
      required:
        [
          name,
          price_millimes,
          category_id,
          barcode,
          description,
          image_url,
          is_available,
          track_stock,
        ]
      properties:
        name: { type: string, minLength: 1 }
        price_millimes: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        barcode: { type: string }
        description: { type: string }
        image_url: { type: string }
        is_available: { type: boolean }
        track_stock: { type: boolean }

    ProductCreate:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - type: object
          required: [opening_stock]
          properties:
            opening_stock: { type: integer, minimum: 0 }

    ProductUpdate:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - type: object
          required: [stock_delta]
          properties:
            stock_delta:
              type: integer
              description: Counted minus the stock shown when the edit started; written as an adjustment movement.

    StockAdjustment:
      type: object
      description: An admin counting stock by hand, written as a record so a retry cannot count the same correction twice.
      required: [id, product_id, qty_delta, reason, payload_hash]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        product_id: { $ref: '#/components/schemas/Uuid' }
        qty_delta: { type: integer, not: { const: 0 } }
        reason: { type: string, minLength: 1 }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }

    StockAdjustmentResult:
      type: object
      description: What the correction did, or what it did the first time it arrived - the stock as of then, not as of now.
      required: [status, product_id, stock_qty]
      properties:
        status: { $ref: '#/components/schemas/WriteStatus' }
        product_id: { $ref: '#/components/schemas/Uuid' }
        stock_qty: { type: integer }

    DiningTable:
      type: object
      required: [id, name, sort_order, is_active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1 }
        sort_order: { type: integer }
        is_active:
          type: boolean
          description: A table is retired, never deleted - old sales keep its name - and a retired one takes nothing new (TABLE_INACTIVE).

    DiningTableInput:
      type: object
      required: [name, sort_order, is_active]
      properties:
        name: { type: string, minLength: 1 }
        sort_order: { type: integer, minimum: 0 }
        is_active: { type: boolean }

    OpenOrderItem:
      type: object
      description: |
        One line on a table. name_snapshot and unit_price_millimes are copied when the item is added,
        so a later price change never moves what a guest already ordered. A removed item keeps its
        row: the admin's report of items removed after they were sent is the point.
      required:
        [
          id,
          order_id,
          product_id,
          name_snapshot,
          unit_price_millimes,
          qty,
          note,
          added_by,
          added_at,
          sent_at,
          prepared_at,
          removed_at,
          removed_by,
          removed_reason,
          paid_sale_id,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        order_id: { $ref: '#/components/schemas/Uuid' }
        product_id: { $ref: '#/components/schemas/Uuid' }
        name_snapshot: { type: string }
        unit_price_millimes: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
        qty: { type: integer, minimum: 1 }
        note: { type: string }
        added_by: { $ref: '#/components/schemas/Uuid' }
        added_at: { $ref: '#/components/schemas/Timestamp' }
        sent_at:
          type: [string, 'null']
          format: date-time
          description: When the kitchen was told. Items sent together are one ticket.
        prepared_at: { type: [string, 'null'], format: date-time }
        removed_at: { type: [string, 'null'], format: date-time }
        removed_by: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        removed_reason: { type: [string, 'null'] }
        paid_sale_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: The sale that paid this item, or null while it is unpaid.

    OpenOrder:
      type: object
      required: [id, table_id, status, opened_at, closed_at, items]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        table_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [open, closed, cancelled] }
        opened_at: { $ref: '#/components/schemas/Timestamp' }
        closed_at: { type: [string, 'null'], format: date-time }
        items:
          type: array
          description: Every line ever put on this order, removed and paid ones included, oldest first.
          items: { $ref: '#/components/schemas/OpenOrderItem' }

    TableBoardEntry:
      type: object
      description: One tile of the table grid the waiter and the caisse both read.
      required: [table, order_id, opened_at, due_millimes, active_count, unsent_count, unpaid_count]
      properties:
        table: { $ref: '#/components/schemas/DiningTable' }
        order_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: The table's open order, or null when the table is free.
        opened_at: { type: [string, 'null'], format: date-time }
        due_millimes:
          allOf: [{ $ref: '#/components/schemas/Millimes' }]
          description: What the unpaid, active items come to - what is still owed on this table.
        active_count: { type: integer, minimum: 0 }
        unsent_count: { type: integer, minimum: 0 }
        unpaid_count: { type: integer, minimum: 0 }

    KitchenTicket:
      type: object
      description: One send - the items a waiter told the kitchen about at the same moment.
      required: [order_id, table_id, table_name, sent_at, items]
      properties:
        order_id: { $ref: '#/components/schemas/Uuid' }
        table_id: { $ref: '#/components/schemas/Uuid' }
        table_name: { type: string }
        sent_at: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OpenOrderItem' }

    RemovedAfterSentItem:
      type: object
      description: An item a waiter removed after the kitchen had already been told, for the admin's report.
      required:
        [
          item_id,
          table_name,
          product_name,
          qty,
          unit_price_millimes,
          sent_at,
          removed_at,
          removed_by,
          removed_by_name,
          removed_reason,
          submitted_by,
          submitted_by_name,
        ]
      properties:
        item_id: { $ref: '#/components/schemas/Uuid' }
        table_name: { type: string }
        product_name: { type: string }
        qty: { type: integer }
        unit_price_millimes: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
        sent_at: { $ref: '#/components/schemas/Timestamp' }
        removed_at: { $ref: '#/components/schemas/Timestamp' }
        removed_by:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: The person the removal names - its record's actor_user_id, or the caller when it named nobody.
        removed_by_name: { type: string }
        removed_reason: { type: string }
        submitted_by:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: |
            The login the removal was sent under. The same person as removed_by unless a phone was passed on
            or the record named someone else; null for an item taken off before this was recorded.
        submitted_by_name:
          type: [string, 'null']
          description: The display name of submitted_by; null when submitted_by is.

    OrderRecord:
      type: object
      description: What every order event carries - who did it, the device that wrote it, possibly offline, and how a replay is recognised.
      required: [id, device_id, created_at, payload_hash]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actor_user_id:
          allOf: [{ $ref: '#/components/schemas/Uuid' }]
          description: |
            Who did it: the member signed in on the device when the record was written, who need not be the
            caller - a phone passed between waiters sends one waiter's records under the next one's login.
            FORBIDDEN when that person is not a member of the caller's shop. Stamped where the record stamps a
            person: added_by on the item an add creates, removed_by on the items a removal or a cancel takes
            off. Absent on a record written before records named their author, and the caller is credited.
        device_id: { type: string, minLength: 1 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }

    OrderItemAddRecord:
      allOf:
        - $ref: '#/components/schemas/OrderRecord'
        - type: object
          description: |
            Adding names the table, never an order, so two devices adding to the same free table cannot
            race on creating one. An add for a table whose order was already paid opens a new order,
            so a waiter's offline add is never lost; only TABLE_INACTIVE and FORBIDDEN refuse it.
          required: [table_id, product_id, qty, note]
          properties:
            table_id: { $ref: '#/components/schemas/Uuid' }
            product_id: { $ref: '#/components/schemas/Uuid' }
            qty: { type: integer, minimum: 1 }
            note: { type: string }

    OrderItemRemoveRecord:
      allOf:
        - $ref: '#/components/schemas/OrderRecord'
        - type: object
          required: [item_id, reason]
          properties:
            item_id: { $ref: '#/components/schemas/Uuid' }
            reason: { type: string, minLength: 1 }

    OrderSendRecord:
      allOf:
        - $ref: '#/components/schemas/OrderRecord'
        - type: object
          required: [table_id]
          properties:
            table_id: { $ref: '#/components/schemas/Uuid' }

    OrderItemPrepareRecord:
      allOf:
        - $ref: '#/components/schemas/OrderRecord'
        - type: object
          required: [item_id]
          properties:
            item_id: { $ref: '#/components/schemas/Uuid' }

    OrderCancelRecord:
      allOf:
        - $ref: '#/components/schemas/OrderRecord'
        - type: object
          required: [table_id, reason]
          properties:
            table_id: { $ref: '#/components/schemas/Uuid' }
            reason: { type: string, minLength: 1 }

    OrderItemAddResult:
      type: object
      required: [status, order_id, item_id]
      properties:
        status: { $ref: '#/components/schemas/WriteStatus' }
        order_id: { $ref: '#/components/schemas/Uuid' }
        item_id: { $ref: '#/components/schemas/Uuid' }

    OrderWriteResult:
      type: object
      required: [status, order_id, affected]
      properties:
        status: { $ref: '#/components/schemas/WriteStatus' }
        order_id: { $ref: '#/components/schemas/Uuid' }
        affected:
          type: integer
          minimum: 0
          description: How many items the write touched - sent, prepared, removed or cancelled. A replay answers the stored count, not the work done again.

    RealtimeTopic:
      type: string
      enum: [open_orders, open_order_items, dining_tables, products]

    OpenOrderChanges:
      type: object
      description: |
        What changed in the caller's shop since `since`, for a client with no live connection. The
        answer carries no rows: the client re-reads the queries a topic covers, so a missed or a
        repeated event costs a refetch and never a wrong screen.
      required: [cursor, topics]
      properties:
        cursor:
          type: string
          description: Opaque. Send it back as `since` on the next poll.
        topics:
          type: array
          description: Each topic that changed, named once. Empty when nothing did, and on the first poll.
          items: { $ref: '#/components/schemas/RealtimeTopic' }

    ShopSettings:
      type: object
      required: [receipt_footer]
      properties:
        receipt_footer: { type: string, maxLength: 500 }

    TerminalRegistration:
      type: object
      required: [terminal_id, code, last_seq, epoch, open_session]
      properties:
        terminal_id: { $ref: '#/components/schemas/Uuid' }
        code: { $ref: '#/components/schemas/TerminalCode' }
        last_seq:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: The receipt counter the device adopts.,
          }
        epoch: { type: integer, minimum: 0 }
        open_session:
          oneOf:
            - $ref: '#/components/schemas/CashSession'
            - type: 'null'

    MethodTotals:
      type: object
      required: [sales_millimes, refunds_millimes, net_millimes]
      properties:
        sales_millimes: { $ref: '#/components/schemas/Millimes' }
        refunds_millimes: { $ref: '#/components/schemas/Millimes' }
        net_millimes: { $ref: '#/components/schemas/Millimes' }

    ZReport:
      type: object
      description: |
        gross = sum of sale totals; refunds = sum of refund totals as a positive amount; net = gross - refunds;
        expected_cash = opening_float + cash sales - cash refunds; variance = counted - expected (null while open).
      required:
        - session_id
        - opening_float_millimes
        - sales_count
        - refunds_count
        - gross_millimes
        - refunds_millimes
        - net_millimes
        - by_method
        - expected_cash_millimes
        - counted_cash_millimes
        - variance_millimes
        - voids_count
      properties:
        session_id: { $ref: '#/components/schemas/Uuid' }
        opening_float_millimes: { $ref: '#/components/schemas/Millimes' }
        sales_count: { type: integer, minimum: 0 }
        refunds_count: { type: integer, minimum: 0 }
        gross_millimes: { $ref: '#/components/schemas/Millimes' }
        refunds_millimes: { $ref: '#/components/schemas/Millimes' }
        net_millimes: { $ref: '#/components/schemas/Millimes' }
        by_method:
          type: object
          required: [cash, card]
          properties:
            cash: { $ref: '#/components/schemas/MethodTotals' }
            card: { $ref: '#/components/schemas/MethodTotals' }
        expected_cash_millimes: { $ref: '#/components/schemas/Millimes' }
        counted_cash_millimes: { type: [integer, 'null'], format: int64 }
        variance_millimes: { type: [integer, 'null'], format: int64 }
        voids_count: { type: integer, minimum: 0 }

    CashSession:
      type: object
      required:
        [
          id,
          terminal_id,
          terminal_code,
          opened_by,
          opened_at,
          opening_float_millimes,
          closed_at,
          closed_by,
          closing_counted_millimes,
          force_close_reason,
          z_report,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        terminal_id: { $ref: '#/components/schemas/Uuid' }
        terminal_code: { $ref: '#/components/schemas/TerminalCode' }
        opened_by: { $ref: '#/components/schemas/Uuid' }
        opened_at: { $ref: '#/components/schemas/Timestamp' }
        opening_float_millimes: { $ref: '#/components/schemas/Millimes' }
        closed_at: { type: [string, 'null'], format: date-time }
        closed_by: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        closing_counted_millimes: { type: [integer, 'null'], format: int64 }
        force_close_reason: { type: [string, 'null'] }
        z_report:
          oneOf:
            - $ref: '#/components/schemas/ZReport'
            - type: 'null'

    OpenSessionRecord:
      type: object
      required:
        [id, terminal_code, epoch, actor_user_id, opened_at, opening_float_millimes, payload_hash]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        terminal_code: { $ref: '#/components/schemas/TerminalCode' }
        epoch: { type: integer, minimum: 0 }
        actor_user_id:
          $ref: '#/components/schemas/Uuid'
        opened_at: { $ref: '#/components/schemas/Timestamp' }
        opening_float_millimes: { type: integer, format: int64, minimum: 0 }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }

    CloseSessionRecord:
      type: object
      required:
        [
          id,
          session_id,
          terminal_code,
          epoch,
          actor_user_id,
          closed_at,
          closing_counted_millimes,
          client_z_report,
          payload_hash,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        session_id: { $ref: '#/components/schemas/Uuid' }
        terminal_code: { $ref: '#/components/schemas/TerminalCode' }
        epoch: { type: integer, minimum: 0 }
        actor_user_id: { $ref: '#/components/schemas/Uuid' }
        closed_at: { $ref: '#/components/schemas/Timestamp' }
        closing_counted_millimes: { type: integer, format: int64, minimum: 0 }
        client_z_report:
          oneOf:
            - $ref: '#/components/schemas/ZReport'
            - type: 'null'
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }

    WriteStatus:
      type: string
      enum: [created, replayed]

    OpenSessionResult:
      type: object
      required: [session_id, status, session]
      properties:
        session_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/WriteStatus' }
        session: { $ref: '#/components/schemas/CashSession' }

    CloseSessionResult:
      type: object
      required: [session_id, status, z_report]
      properties:
        session_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/WriteStatus' }
        z_report: { $ref: '#/components/schemas/ZReport' }

    SaleLine:
      type: object
      description: |
        Sale line: qty >= 1, net_millimes = qty * unit_price - line_discount - allocated_discount.
        Refund line: qty <= -1, refunds_sale_line_id set, no discounts, net_millimes <= 0.
        open_order_item_id names the item on the table this line pays; it is null for a counter sale,
        which sat on no table, and for every refund line.

        The row id is the writing device's to choose, not the server's: a register that sold offline
        and is refunding the same receipt has to name the lines it gives back before either record
        has been stored anywhere.
      required:
        [
          id,
          line_no,
          open_order_item_id,
          product_id,
          product_name,
          qty,
          unit_price_millimes,
          line_discount_millimes,
          line_discount_reason,
          allocated_discount_millimes,
          net_millimes,
          refunds_sale_line_id,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        line_no: { type: integer, minimum: 1 }
        open_order_item_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        product_id: { $ref: '#/components/schemas/Uuid' }
        product_name: { type: string }
        qty: { type: integer, not: { const: 0 } }
        unit_price_millimes: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
        line_discount_millimes: { type: integer, format: int64, minimum: 0 }
        line_discount_reason:
          type: [string, 'null']
          description: Why this line was discounted or offered. A line discount without a reason is refused.
        allocated_discount_millimes:
          type: integer
          format: int64
          minimum: 0
          description: This line's share of the cart discount, allocated by largest remainder so the parts sum exactly.
        net_millimes: { $ref: '#/components/schemas/Millimes' }
        refunds_sale_line_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }

    Payment:
      type: object
      description: Cash sale - tendered >= total, change = tendered - total. Card sale and every refund - tendered = total, change = 0.
      required: [method, tendered_millimes, change_millimes]
      properties:
        method: { type: string, enum: [cash, card] }
        tendered_millimes: { $ref: '#/components/schemas/Millimes' }
        change_millimes: { type: integer, format: int64, minimum: 0 }

    SaleRecord:
      type: object
      required:
        [
          id,
          kind,
          terminal_code,
          epoch,
          seq,
          session_id,
          table_id,
          created_at,
          lines,
          cart_discount_millimes,
          total_millimes,
          payment,
          refunds_sale_id,
          payload_hash,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [sale, refund] }
        terminal_code: { $ref: '#/components/schemas/TerminalCode' }
        epoch: { type: integer, minimum: 0 }
        seq:
          {
            type: integer,
            format: int64,
            minimum: 1,
            description: "Must be the terminal's last_seq + 1.",
          }
        session_id: { $ref: '#/components/schemas/Uuid' }
        table_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: The table being paid, or null for a counter sale and for a refund.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SaleLine' }
        cart_discount_millimes: { type: integer, format: int64, minimum: 0 }
        total_millimes: { $ref: '#/components/schemas/Millimes' }
        payment: { $ref: '#/components/schemas/Payment' }
        refunds_sale_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        payload_hash: { $ref: '#/components/schemas/PayloadHash' }

    RecordSaleResult:
      type: object
      required: [sale_id, receipt_number, status]
      properties:
        sale_id: { $ref: '#/components/schemas/Uuid' }
        receipt_number: { type: string, examples: ['T1-42'] }
        status: { type: string, enum: [created, replayed, voided] }

    SaleLineView:
      allOf:
        - $ref: '#/components/schemas/SaleLine'
        - type: object
          required: [refunded_qty, refunded_millimes]
          properties:
            refunded_qty: { type: integer, minimum: 0 }
            refunded_millimes: { $ref: '#/components/schemas/Millimes' }

    Sale:
      type: object
      required:
        [
          id,
          kind,
          receipt_number,
          seq,
          terminal_id,
          terminal_code,
          session_id,
          table_id,
          table_name,
          refunds_sale_id,
          payment_method,
          cart_discount_millimes,
          total_millimes,
          tendered_millimes,
          change_millimes,
          created_at,
          received_at,
          lines,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [sale, refund] }
        receipt_number: { type: string }
        seq: { type: integer, format: int64, minimum: 1 }
        terminal_id: { $ref: '#/components/schemas/Uuid' }
        terminal_code: { $ref: '#/components/schemas/TerminalCode' }
        session_id: { $ref: '#/components/schemas/Uuid' }
        table_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        table_name:
          type: [string, 'null']
          description: The table's name as it is now, for a receipt someone reads later; null for a counter sale.
        refunds_sale_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        payment_method: { type: string, enum: [cash, card] }
        cart_discount_millimes: { $ref: '#/components/schemas/Millimes' }
        total_millimes: { $ref: '#/components/schemas/Millimes' }
        tendered_millimes: { $ref: '#/components/schemas/Millimes' }
        change_millimes: { $ref: '#/components/schemas/Millimes' }
        created_at:
          $ref: '#/components/schemas/Timestamp'
        received_at: { $ref: '#/components/schemas/Timestamp' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SaleLineView' }

    VoidReceiptRequest:
      type: object
      required: [record, error_code, reason]
      properties:
        record: { $ref: '#/components/schemas/SaleRecord' }
        error_code: { $ref: '#/components/schemas/ErrorCode' }
        reason: { type: string, minLength: 1 }

    VoidReceiptResult:
      type: object
      required: [sale_id, receipt_number, status]
      properties:
        sale_id: { $ref: '#/components/schemas/Uuid' }
        receipt_number: { type: string }
        status: { type: string, enum: [voided, replayed, recorded] }
