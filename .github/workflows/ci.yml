name: ci

on:
  push:
    branches: ['**']
  pull_request:
  # To run it by hand on any branch: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: no dependency needs its install script to build or test (esbuild and
      # Tailwind ship their binaries as optional dependencies; msw's copies a browser worker the tests
      # do not use), so an install runs no third-party code.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      # The whole Vitest suite, including the port contract suite on the memory and REST backends.
      - run: npm test
      - name: build (memory demo, no server settings)
        run: npm run build
        env:
          VITE_BACKEND: memory

  e2e:
    name: the café on one device (Playwright, memory backend)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The specs use the runner's Google Chrome (channel: chrome), so no browser download. With no
      # E2E_BACKEND set, only the memory project is configured.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-memory
          path: playwright-report
          # A run that fails before the reporter writes anything must not fail the upload as well.
          if-no-files-found: ignore
          retention-days: 7

  symfony:
    name: the Symfony service, its tests, the contract suite and the café on three devices
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafe
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: install the server's dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      # Not the job's `env:`. Symfony reads its configuration from $_ENV and $_SERVER, never
      # getenv(), and PHP's built-in server fills neither from the process environment - so a server
      # started with DATABASE_URL exported would quietly use the 5433 in .env, which is a port on
      # the developer's machine and nothing here. .env.local is what a developer overrides .env
      # with, and every SAPI reads it the same way.
      - name: the database this run uses
        working-directory: api
        run: |
          cat > .env.local <<'ENV'
          DATABASE_URL="postgresql://cafe_app:cafe_app@127.0.0.1:5432/cafe?serverVersion=17&charset=utf8"
          DATABASE_ADMIN_URL="postgresql://postgres:postgres@127.0.0.1:5432/cafe?serverVersion=17&charset=utf8"
          ENV
          # Symfony ignores .env.local in the test environment on purpose, so that a developer's
          # local overrides cannot change what the tests do. The tests need saying to as well, and
          # .env.test.local is where. The `_test` suffix is doctrine.yaml's (when@test).
          cp .env.local .env.test.local
      - name: the keys that sign the tokens
        working-directory: api
        run: php bin/console lexik:jwt:generate-keypair --no-interaction
      # The role the API connects as is created by the first migration, so the owner goes first.
      - name: the schema, and the demo café in it
        working-directory: api
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:seed-demo --no-interaction
      # The rules the money depends on are tested where they live, in SQL, against the café just
      # seeded. pgTAP is packaged for the Postgres of the service container, so it is installed there;
      # pg_prove, which runs the files, is a Perl tool installed here. Every file rolls back.
      - name: the database's own tests (pgTAP)
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c \
            'apt-get update -qq && apt-get install -y -qq postgresql-17-pgtap > /dev/null'
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtap-parser-sourcehandler-pgtap-perl > /dev/null
          PGPASSWORD=postgres pg_prove -h 127.0.0.1 -U postgres -d cafe api/tests/pgtap/*.test.sql
      # Its own database, created by the owner because the API's role may not create one, and filled
      # with the schema and the café by the test bootstrap itself.
      - name: the server's own tests
        working-directory: api
        run: |
          php bin/console doctrine:database:create --no-interaction --if-not-exists --connection=admin --env=test
          php bin/phpunit
      - name: start the server, and sign a member in
        working-directory: api
        run: |
          nohup php -S 127.0.0.1:8000 -t public > "$RUNNER_TEMP/server.log" 2>&1 &
          up=
          for _ in $(seq 1 30); do
            # 401 is the contract's answer to a request with no token, and takes the whole server
            # to say it: waiting for a 2xx here would wait for ever.
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/products)" = "401" ]; then
              up=yes
              break
            fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo 'the server did not come up' >&2
            cat "$RUNNER_TEMP/server.log" >&2
            exit 1
          fi
          echo 'the API answers 401 without a token'
          # And the first thing every device does, so that a server that cannot do it says why here
          # rather than sixty tests later.
          code=$(curl -s -o "$RUNNER_TEMP/token.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo.local","password":"demo-admin-2026"}')
          echo "signing in answers $code"
          if [ "$code" != "200" ]; then
            cat "$RUNNER_TEMP/token.json" >&2
            exit 1
          fi
      - name: the port contract suite, against the running server
        run: npx vitest run live.contract
        env:
          CONTRACT_BACKEND: rest
      - name: the café on three devices (Playwright)
        run: npx playwright test --project=rest
        env:
          E2E_BACKEND: rest
      # Whatever the server said to itself while the suites above were running.
      - name: the server's log
        if: failure()
        working-directory: api
        run: |
          tail -n 200 "$RUNNER_TEMP/server.log" || true
          tail -n 200 var/log/dev.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-rest
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
      # The delivery path itself: the image, its entrypoint - keys, migrations, the demo café - and a
      # database of its own behind it. The port the server above was on, once it has let go of it.
      - name: the container serves the same café
        run: |
          pkill -f 'php -S 127.0.0.1:8000' || true
          docker compose --profile cafe up --build --detach db api
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/products)" = "401" ] && break
            sleep 2
          done
          token=$(curl -sS -X POST http://127.0.0.1:8000/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@demo.local","password":"demo-owner-2026"}' | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = null ]; then
            docker compose --profile cafe logs api >&2
            echo 'the container would not sign the owner in' >&2
            exit 1
          fi
          # And the token is worth something on the next request, which is the whole point of one.
          code=$(curl -s -o "$RUNNER_TEMP/me.json" -w '%{http_code}'             http://127.0.0.1:8000/api/v1/me -H "Authorization: Bearer $token")
          echo "the token is worth $code"
          if [ "$code" != "200" ]; then
            cat "$RUNNER_TEMP/me.json" >&2
            docker compose --profile cafe logs api >&2
            exit 1
          fi
          jq -e '.roles | index("admin")' "$RUNNER_TEMP/me.json"
      - if: always()
        run: docker compose --profile cafe down --volumes
